
stages:
  - build
  - deploy

# Shared .build_docker / .update_and_deploy templates live in eva-k8s
# See https://github.com/EBIvariation/eva-k8s/blob/main/gitlab-ci/webservice.yml.
include:
  - remote: 'https://raw.githubusercontent.com/EBIvariation/eva-k8s/refs/tags/v1.1/gitlab-ci/webservice.yml'

# REQUIRED GitLab CI/CD Variables (Global):
# DOCKER_AUTH_CONFIG: Contains username and password for the docker registry above
# GITHUB_USER: GitHub username for accessing private maven settings repository
# GITHUB_TOKEN: GitHub personal access token for accessing private maven settings repository

# ============================================================================
# PRODUCTION: Deploy on git tags
# ============================================================================

build:docker:prod:
  extends: .build_docker
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_REPOSITORY: dockerhub.ebi.ac.uk/ebivariation/eva-seqcol
    IMAGE_TAG: $CI_COMMIT_TAG
  only:
    - tags

deploy-to-cluster:prod:
  extends: .update_and_deploy
  needs:
    - build:docker:prod
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_TAG: $CI_COMMIT_TAG
    MAVEN_PROFILE: production
    K8S_MANIFEST_PATH: k8s-manifests/eva-seqcol/overlays/prod
    KUBECONFIG_FILE: $KUBECONFIG_FILE_PROD
  environment:
    name: prod
  only:
    - tags

deploy-to-cluster:prod-fallback:
  extends: .update_and_deploy
  needs:
    - build:docker:prod
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_TAG: $CI_COMMIT_TAG
    MAVEN_PROFILE: production,production-fallback
    K8S_MANIFEST_PATH: k8s-manifests/eva-seqcol/overlays/prod
    KUBECONFIG_FILE: $KUBECONFIG_FILE_PROD_FALLBACK
  environment:
    name: prod-fallback
  only:
    - tags

# ============================================================================
# DEVELOPMENT: Deploy on main branch
# ============================================================================

build:docker:dev:
  extends: .build_docker
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_REPOSITORY: dockerhub.ebi.ac.uk/ebivariation/eva-seqcol
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  only:
    - main

deploy-to-cluster:dev:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
    MAVEN_PROFILE: development
    K8S_MANIFEST_PATH: k8s-manifests/eva-seqcol/overlays/dev
    KUBECONFIG_FILE: $KUBECONFIG_FILE_DEV
  environment:
    name: development
  only:
    - main

# ============================================================================
# STAGING: Deploy on main branch
# ============================================================================

deploy-to-cluster:staging:
  extends: .update_and_deploy
  needs:
    - build:docker:dev
  variables:
    SERVICE_NAME: eva-seqcol
    IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
    MAVEN_PROFILE: production_processing
    K8S_MANIFEST_PATH: k8s-manifests/eva-seqcol/overlays/staging
    KUBECONFIG_FILE: $KUBECONFIG_FILE_STAGING
  environment:
    name: staging
  only:
    - main
